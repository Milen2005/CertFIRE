<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertFIRE - Login</title>
    <!-- Google Fonts: Outfit and Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="styles.css">
    <meta name="description" content="Login to CertFIRE festival portal to manage your events and certificates.">
</head>
<body class="login-page">

    <main class="login-container">
        
        <!-- Logo Header -->
        <div class="login-logo-section animate-fade-in-down">
            <a href="index.html" class="logo login-portal-logo">
                Cert<span>FIRE</span>
            </a>
            <div class="login-subtitle-portal">TECH FESTIVAL PORTAL</div>
        </div>

        <!-- Login Card -->
        <form id="form-login" class="login-card animate-reveal">
            
            <h1 class="login-card-title">Welcome Back</h1>
            <p class="login-card-desc">Sign in to access your festival dashboard and schedule.</p>

            <!-- Username or Email -->
            <div class="form-group">
                <label for="login-username">Username or Email</label>
                <div class="input-icon-wrapper">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    <input type="text" id="login-username" placeholder="cyberpunk@certfire.io" required class="form-input input-with-icon">
                </div>
            </div>

            <!-- Password with Forgot Password link -->
            <div class="form-group">
                <div class="password-header-row">
                    <label for="login-password">Password</label>
                    <a href="#" class="forgot-password-link" id="btn-forgot-password">Forgot Password?</a>
                </div>
                <div class="input-icon-wrapper">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="password" id="login-password" placeholder="........" required class="form-input input-with-icon">
                </div>
            </div>

            <!-- Login Button -->
            <button type="submit" class="btn-gradient-cyan ripple" id="btn-submit-login" style="margin-top: 12px;">
                Login
            </button>

            <!-- Divider -->
            <div class="divider-container">OR</div>

            <!-- Google Signin Button -->
            <button type="button" class="btn-google-signup" id="btn-google-login">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5.04c1.88 0 3.32.8 4.04 1.48l3.08-3.08C17.28 1.64 14.88 1 12 1 7.28 1 3.28 3.76 1.36 7.8l3.68 2.84c.88-2.64 3.36-4.6 6.96-4.6z" fill="#ea4335" stroke="none"></path>
                    <path d="M23 12.24c0-.8-.08-1.6-.24-2.36H12v4.52h6.2c-.28 1.44-1.08 2.68-2.32 3.52l3.6 2.8c2.12-1.96 3.52-4.84 3.52-8.48z" fill="#4285f4" stroke="none"></path>
                    <path d="M5.04 10.64a7.17 7.17 0 0 1 0 2.72l-3.68 2.84C.48 14.48 0 13.28 0 12c0-1.28.48-2.48 1.36-4.2l3.68 2.84z" fill="#fbbc05" stroke="none"></path>
                    <path d="M12 23c3.24 0 5.96-1.08 7.96-2.92l-3.6-2.8c-1.12.76-2.52 1.2-4.36 1.2-3.6 0-6.08-1.96-6.96-4.6L1.36 16.72C3.28 20.24 7.28 23 12 23z" fill="#34a853" stroke="none"></path>
                </svg>
                Sign in with Google
            </button>

            <!-- Sign Up footer link -->
            <div class="signup-footer-link">
                Don't have an account? <a href="signup.html" id="btn-signup-here">Sign up</a>
            </div>

        </form>

        <!-- Inline Floating Alert Messages -->
        <div class="alert-toast-container" id="alert-container"></div>
    </main>

    <!-- Main JavaScript File -->
    <script src="script.js"></script>

    <!-- Login Page Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('form-login');
            const usernameInput = document.getElementById('login-username');
            const passwordInput = document.getElementById('login-password');
            const toastContainer = document.getElementById('alert-container');

            // Toast Helper
            const showToast = (message, type = 'info') => {
                const toast = document.createElement('div');
                toast.className = `alert-toast ${type}`;
                
                let iconSvg = '';
                if (type === 'success') {
                    iconSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`;
                } else if (type === 'error') {
                    iconSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`;
                } else {
                    iconSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-cyan)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`;
                }

                toast.innerHTML = `
                    <span class="toast-icon">${iconSvg}</span>
                    <span class="toast-message">${message}</span>
                `;
                
                toastContainer.appendChild(toast);
                
                setTimeout(() => {
                    toast.style.animation = 'fadeInUp 0.3s cubic-bezier(0.25, 1, 0.5, 1) reverse forwards';
                    setTimeout(() => toast.remove(), 300);
                }, 4000);
            };

            // Form Submit Logic
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();

                const username = usernameInput.value.trim();
                const password = passwordInput.value;

                if (!username || !password) {
                    showToast('Please fill in all fields.', 'error');
                    return;
                }

                showToast('Verifying credentials...', 'info');

                setTimeout(() => {
                    showToast('Login successful! Welcome back.', 'success');
                    sessionStorage.setItem('isLoggedIn', 'true');

                    // Check if there is a redirect URL in the query params
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirectUrl = urlParams.get('redirect');

                    setTimeout(() => {
                        if (redirectUrl) {
                            window.location.href = redirectUrl;
                        } else {
                            window.location.href = 'create-fest.html';
                        }
                    }, 1500);
                }, 1200);
            });

            // Google login mock
            document.getElementById('btn-google-login').addEventListener('click', () => {
                showToast('Connecting with Google...', 'info');
                setTimeout(() => {
                    showToast('Successfully logged in with Google!', 'success');
                    sessionStorage.setItem('isLoggedIn', 'true');
                    
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirectUrl = urlParams.get('redirect');

                    setTimeout(() => {
                        if (redirectUrl) {
                            window.location.href = redirectUrl;
                        } else {
                            window.location.href = 'create-fest.html';
                        }
                    }, 1500);
                }, 1000);
            });

            // Forgot Password simulation
            document.getElementById('btn-forgot-password').addEventListener('click', (e) => {
                e.preventDefault();
                const email = usernameInput.value.trim();
                if (!email) {
                    showToast('Please enter your email in the Username/Email field first.', 'error');
                    usernameInput.focus();
                    return;
                }
                showToast(`Password reset link sent to ${email}`, 'success');
            });
        });
    </script>

</body>
</html>
